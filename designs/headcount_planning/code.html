<button aria-label="Increase headcount" class="w-14 h-14 rounded-full bg-primary-container text-on-primary flex items-center justify-center hover:bg-[#d8751d] transition-colors active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="btn-increase">

            Calculate Items
        </button>

<!-- Scripts for Interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const countDisplay = document.getElementById('headcount-value');
            const btnDecrease = document.getElementById('btn-decrease');
            const btnIncrease = document.getElementById('btn-increase');
            let count = 2;

            function updateDisplay() {
                countDisplay.textContent = count;
                // Add a little pop animation
                countDisplay.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    countDisplay.style.transform = 'scale(1)';
                }, 150);
            }

            btnDecrease.addEventListener('click', () => {
                if (count > 1) {
                    count--;
                    updateDisplay();
                }
            });

            btnIncrease.addEventListener('click', () => {
                if (count < 50) { // arbitrary limit
                    count++;
                    updateDisplay();
                }
            });
            
            // Initial style setup for animation
            countDisplay.style.transition = 'transform 0.15s ease-out';
        });
    </script>
