<script>
        // Simple script to handle radio button visual state updates if needed beyond CSS peer logic
        document.querySelectorAll('input[type="radio"][name="language"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // Remove shadow from all
                document.querySelectorAll('input[type="radio"][name="language"]').forEach(r => {
                    r.nextElementSibling.classList.remove('ritual-shadow');
                    r.nextElementSibling.classList.add('bg-soft-sand/50');
                    r.nextElementSibling.classList.remove('bg-soft-sand');
                });
                
                // Add shadow to selected
                if(e.target.checked) {
                    e.target.nextElementSibling.classList.add('ritual-shadow');
                    e.target.nextElementSibling.classList.remove('bg-soft-sand/50');
                    e.target.nextElementSibling.classList.add('bg-soft-sand');
                }
            });
        });
    </script>
