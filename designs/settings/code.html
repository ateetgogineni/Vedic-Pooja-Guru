</button>

<div class="w-10 h-10 rounded-full overflow-hidden bg-soft-sand flex items-center justify-center">

<span class="font-body-lg text-body-lg text-on-surface">Language</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">

<span class="material-symbols-outlined" data-icon="chevron_right">chevron_right</span>
</div>
</button>
</li>
<!-- Region/Tradition -->

</button>
