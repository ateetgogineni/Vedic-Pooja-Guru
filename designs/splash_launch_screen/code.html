<style>
        /* Pulse Animation for Loading Indicator */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.95); }
        }
        .animate-subtle-pulse {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Float Animation for Logo */
        @keyframes float-gentle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-float-gentle {
            animation: float-gentle 4s ease-in-out infinite;
        }

        /* Gradient Background to replace image */
        .bg-splash-gradient {
            background: radial-gradient(circle at 50% 40%, var(--tw-colors-warm-ivory) 0%, #fef3e5 40%, #fae6d3 100%);
        }
        
        .glow-shadow {
            box-shadow: 0 0 60px 20px rgba(233, 134, 46, 0.15); /* Soft Saffron Glow */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-splash-gradient min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Subtle Mandala Watermark (Background Texture) -->
<div class="absolute inset-0 pointer-events-none opacity-[0.03] flex items-center justify-center">
<svg class="w-[800px] h-[800px] max-w-none text-primary" fill="currentColor" opacity="0.5" viewbox="0 0 500 500">
<path d="M250 0C250 0 260 100 350 150C440 200 500 250 500 250C500 250 400 260 350 350C300 440 250 500 250 500C250 500 240 400 150 350C60 300 0 250 0 250C0 250 100 240 150 150C200 60 250 0 250 0Z"></path>
<circle cx="250" cy="250" fill="none" r="100" stroke="currentColor" stroke-width="4"></circle>
<circle cx="250" cy="250" fill="none" r="150" stroke="currentColor" stroke-dasharray="10 10" stroke-width="2"></circle>
</svg>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 flex flex-col items-center justify-center flex-1 w-full max-w-md px-margin-mobile">
<!-- Logo Area -->
<div class="flex flex-col items-center space-y-stack-md animate-float-gentle">
<!-- Diya/Lotus Icon Container with Glow -->
<div class="relative w-32 h-32 flex items-center justify-center rounded-full glow-shadow bg-surface-container-lowest shadow-sm border border-soft-sand">
<span class="material-symbols-outlined text-[72px] text-muhurat-amber" style="font-variation-settings: 'FILL' 1;">
                    local_fire_department
                </span>
<!-- Inner soft glow -->
<div class="absolute inset-0 rounded-full bg-gradient-to-tr from-primary-container/20 to-transparent pointer-events-none mix-blend-overlay"></div>
</div>
<!-- Brand Name -->
<div class="text-center mt-stack-md">
<h1 class="font-mantra-display text-mantra-display text-secondary tracking-wide">
                    Vedic Vidhi
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2 opacity-80">
                    Your Virtual Priest’s Assistant
                </p>
</div>
</div>
</main>
<!-- Minimal Loading Indicator at Bottom -->
<footer class="relative z-10 w-full pb-16 flex flex-col items-center justify-end">
<div class="flex items-center space-x-3 animate-subtle-pulse">
<div class="w-1.5 h-1.5 rounded-full bg-muhurat-amber"></div>
<div class="w-1.5 h-1.5 rounded-full bg-muhurat-amber opacity-75"></div>
<div class="w-1.5 h-1.5 rounded-full bg-muhurat-amber opacity-50"></div>
</div>
<p class="mt-4 font-label-sm text-label-sm text-outline uppercase tracking-[0.1em]">
            Preparing Sanctuary
        </p>
</footer>
<!-- No Navigation Bars included as per constraints for a linear/launch intent screen -->
<script>
        // Optional: Simple vanilla JS to fade out the splash screen after a delay
        // Simulating transition to the main app
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.style.transition = 'opacity 1s ease-out';
                // Note: In a real app, this would route to the next screen.
                // Here we just dim slightly to demonstrate interaction capability.
                document.body.style.opacity = '0.9';
            }, 3000);
        });
    </script>
