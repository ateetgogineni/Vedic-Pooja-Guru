<body class="min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed font-headline-md text-headline-md w-full top-0 flat no shadows">
<div class="flex justify-between items-center px-margin-mobile py-4 w-full max-w-7xl mx-auto">
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-mantra-display text-mantra-display text-primary dark:text-primary-fixed">Vedic Vidhi</h1>
<button class="text-on-surface-variant dark:text-outline-variant hover:bg-surface-container dark:hover:bg-surface-container-highest transition-colors active:scale-95 duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="person">person</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin-mobile md:px-margin-desktop py-8 max-w-5xl mx-auto w-full">
<!-- Header Section -->
<div class="text-center mb-stack-lg">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-stack-sm">Select your tradition</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-2xl mx-auto">
                Customize your ritual experience based on your regional practices. You can always change this later in settings.
            </p>
</div>
<!-- Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-stack-lg">
<!-- Option 1: Selected State -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="tradition" type="radio" value="north_indian"/>
<div class="bg-soft-sand rounded-xl p-6 border-2 border-primary-container bg-watermark h-full transition-all duration-300 relative overflow-hidden peer-checked:shadow-[inset_0_0_20px_rgba(233,134,46,0.1)] peer-checked:bg-[rgba(243,233,214,0.9)]">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary-container">
<span class="material-symbols-outlined" data-icon="temple_hindu" style="font-variation-settings: 'FILL' 1;">temple_hindu</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-primary-container flex items-center justify-center bg-primary-container">
<span class="material-symbols-outlined text-white text-[16px]" data-icon="check">check</span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">North Indian</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Includes practices typical of UP, Punjab, Rajasthan, and surrounding regions.</p>
</div>
</label>
<!-- Option 2: Default State -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="tradition" type="radio" value="south_indian"/>
<div class="bg-soft-sand rounded-xl p-6 border-2 border-transparent bg-watermark h-full transition-all duration-300 card-shadow hover:border-outline-variant peer-checked:border-primary-container peer-checked:shadow-[inset_0_0_20px_rgba(233,134,46,0.1)]">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-outline">
<span class="material-symbols-outlined" data-icon="local_florist">local_florist</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors">
<span class="material-symbols-outlined text-transparent text-[16px] peer-checked:text-white" data-icon="check">check</span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">South Indian</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Encompasses Tamil, Telugu, Kannada, and Malayali ritual protocols.</p>
</div>
</label>
<!-- Option 3: Default State -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="tradition" type="radio" value="bengali"/>
<div class="bg-soft-sand rounded-xl p-6 border-2 border-transparent bg-watermark h-full transition-all duration-300 card-shadow hover:border-outline-variant peer-checked:border-primary-container peer-checked:shadow-[inset_0_0_20px_rgba(233,134,46,0.1)]">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-outline">
<span class="material-symbols-outlined" data-icon="festival">festival</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors">
<span class="material-symbols-outlined text-transparent text-[16px] peer-checked:text-white" data-icon="check">check</span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Bengali</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Focuses on Shaktism and eastern regional variations of pooja.</p>
</div>
</label>
<!-- Option 4: Default State -->
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="tradition" type="radio" value="maharashtrian"/>
<div class="bg-soft-sand rounded-xl p-6 border-2 border-transparent bg-watermark h-full transition-all duration-300 card-shadow hover:border-outline-variant peer-checked:border-primary-container peer-checked:shadow-[inset_0_0_20px_rgba(233,134,46,0.1)]">
<div class="flex items-start justify-between mb-4">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-outline">
<span class="material-symbols-outlined" data-icon="settings_accessibility">settings_accessibility</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:bg-primary-container peer-checked:border-primary-container transition-colors">
<span class="material-symbols-outlined text-transparent text-[16px] peer-checked:text-white" data-icon="check">check</span>
</div>
</div>
<h3 class="font-headline-md text-headline-md text-on-surface mb-2">Maharashtrian</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Tailored to western Indian practices and specific deity worship styles.</p>
</div>

<button class="bg-primary-container text-on-primary font-body-lg text-body-lg py-4 px-12 rounded-full shadow-[0_8px_30px_rgba(233,134,46,0.3)] hover:bg-[#d67a29] hover:shadow-[0_12px_40px_rgba(233,134,46,0.4)] active:scale-95 transition-all duration-200 w-full md:w-auto min-w-[240px]">
                Continue
            </button>
</div>

<script>
        // Simple script to handle visual feedback on radio selection if needed beyond CSS
        document.querySelectorAll('input[name="tradition"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                // The CSS peer-checked handles the styling natively, 
                // but this could trigger analytics or save state.
                console.log('Selected tradition:', e.target.value);
            });
        });
    </script>
